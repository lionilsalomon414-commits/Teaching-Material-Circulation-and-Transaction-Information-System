<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - SITTA UT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" class="bg-login">
  <main class="login-card">
    <img src="assets/logo-ut.png" alt="Logo UT" class="logo" onerror="this.style.display='none'">
    <h1>Selamat Datang</h1>
    <p class="sub">Sistem Informasi Tiras dan Transaksi Bahan Ajar</p>
    <form id="form-login" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="email" autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <p id="login-error" class="error" role="alert"></p>
      <button type="button" class="link" data-open="modal-lupa">Lupa password?</button>
      <button type="submit" class="btn">Login</button>
      <button type="button" class="link center" data-open="modal-daftar">Belum punya akun? Daftar</button>
    </form>
  </main>

  <div class="modal" id="modal-lupa" aria-hidden="true">
    <div class="modal-content">
      <button class="close" data-close aria-label="Tutup">&times;</button>
      <h2>Lupa Password</h2>
      <p>Masukkan email Anda, kami kirim tautan reset password.</p>
      <input type="email" id="lupa-email" placeholder="Email terdaftar">
      <p class="error" id="lupa-error"></p>
      <button class="btn" id="btn-lupa">Kirim</button>
    </div>
  </div>

  <div class="modal" id="modal-daftar" aria-hidden="true">
    <div class="modal-content">
      <button class="close" data-close aria-label="Tutup">&times;</button>
      <h2>Daftar Akun</h2>
      <input type="text" id="daftar-nama" placeholder="Nama lengkap">
      <input type="email" id="daftar-email" placeholder="Email">
      <input type="password" id="daftar-pass" placeholder="Password (min. 6 karakter)">
      <p class="error" id="daftar-error"></p>
      <button class="btn" id="btn-daftar">Daftar</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
